<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>आवाज़ चुनो</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:20px system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;padding:12px;gap:12px}
h1{margin:0;font-size:28px}
button{font:bold 24px system-ui;padding:20px;border:0;border-radius:16px;background:#ffd400;color:#000;width:100%}
#list{display:flex;flex-direction:column;gap:12px}
#test{background:#2ecc71}
#out{font-size:26px;line-height:1.4;padding:8px;border:2px solid #444;border-radius:12px;min-height:100px}
</style></head><body>
<h1>आवाज़ चुनो</h1>
<div id="out">नीचे से वह आवाज़ चुनिए जिसमें ऐप बोले। फिर "आवाज़ सुनो" दबाइए।</div>
<div id="list"></div>
<button id="test">आवाज़ सुनो</button>
<button id="back">वापस</button>
<script src="common.js"></script>
<script>
"use strict";
// Lets the person pick which text-to-speech engine the whole app uses (for example a Hindi
// engine other than Google's). The choice is remembered. If the engine ever stops answering the
// app restarts it by itself, and after repeated failures tries the next installed engine.
let engines=[];
try{engines=JSON.parse(A.ttsEngines())}catch(e){}
function render(){
 const cur=A.currentTtsEngine();
 const box=$("list");box.textContent="";
 const mk=(label,pkg)=>{
  const b=document.createElement("button");
  b.textContent=(cur===pkg?"चालू: ":"")+label;
  b.onclick=()=>choose(pkg,label);
  box.appendChild(b)};
 mk("फ़ोन की डिफ़ॉल्ट आवाज़","");
 engines.forEach(e=>mk(e.label,e.name))}
async function choose(pkg,label){
 show(label+" चुन रहा हूँ।");
 const ok=await new Promise(res=>{
  const to=setTimeout(()=>res(false),8000);
  window.onTtsReady=o=>{clearTimeout(to);res(o)};
  A.setTtsEngine(pkg)});
 render();
 if(!ok){show(label+" शुरू नहीं हो सकी। कोई दूसरी चुनिए।");return}
 show(label+" चुनी गई। अगर आवाज़ सुनाई दे रही है तो ठीक है, नहीं तो दूसरी चुनिए।");
 say("नमस्ते, यह मेरी आवाज़ है। सफ़र मोड और पैदल मोड में मैं इसी आवाज़ में बोलूँगा।",true)}
$("test").onclick=()=>say("नमस्ते, यह मेरी आवाज़ है। क्या आपको साफ़ सुनाई दे रही है?",true);
$("back").onclick=()=>{location.href="index.html"};
if(!engines.length)show("कोई आवाज़ इंजन नहीं मिला। फ़ोन की सेटिंग में टेक्स्ट-टू-स्पीच देखिए।");
render();
</script></body></html>
